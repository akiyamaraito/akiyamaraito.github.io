const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));const u=b(D.data);
const show=async k=>{const t=await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},k,u.slice(12));
const raw=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',k))));sessionStorage.setItem('pbk',raw);
if(document.getElementById('r').checked)localStorage.setItem('pbk',raw);document.open();document.write(new TextDecoder().decode(t));document.close()};
(async()=>{const s=sessionStorage.getItem('pbk')||localStorage.getItem('pbk');if(!s)return;
try{document.getElementById('r').checked=!!localStorage.getItem('pbk');await show(await crypto.subtle.importKey('raw',b(s),'AES-GCM',true,['decrypt']))}
catch(x){localStorage.removeItem('pbk');sessionStorage.removeItem('pbk')}})();
document.getElementById('f').onsubmit=async v=>{v.preventDefault();const e=document.getElementById('e');e.textContent='Đang mở…';
try{const p=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('p').value),'PBKDF2',false,['deriveKey']);
await show(await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.salt),iterations:600000,hash:'SHA-256'},p,{name:'AES-GCM',length:256},true,['decrypt']))}
catch(x){e.textContent='Sai mật khẩu'}};
